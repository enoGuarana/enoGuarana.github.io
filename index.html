<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Victor R. Enomoto | AI Researcher & Software Engineer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- VARIÁVEIS & CONFIGURAÇÕES GERAIS --- */
        :root {
            --bg-dark: #090e16;       /* Fundo quase preto */
            --bg-card: #121a2b;       /* Fundo dos cartões */
            --primary: #3b82f6;       /* Azul Tech */
            --accent: #8b5cf6;        /* Roxo IA */
            --glow: #60a5fa;          /* Brilho */
            --text-main: #f1f5f9;     /* Branco suave */
            --text-muted: #94a3b8;    /* Cinza para textos secundários */
            --gradient-main: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        ul { list-style: none; }

        /* --- CONTAINER --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section {
            padding: 100px 0;
            position: relative;
        }

        /* --- HEADER / NAV --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 0;
            background: rgba(9, 14, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero h2 {
            font-size: 1.8rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .typing-text {
            color: var(--accent);
            font-weight: 700;
            position: relative;
        }

        .typing-text::after {
            content: '|';
            animation: blink 1s infinite;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            background: var(--accent);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* --- ABOUT SECTION --- */
        .about-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 60px;
            align-items: center;
        }

        .img-card {
            position: relative;
            border-radius: 20px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 3/4; /* Mantém proporção de retrato */
            overflow: hidden;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que a foto preencha sem distorcer */
            border-radius: 15px;
            display: block;
            filter: grayscale(20%);
            transition: 0.5s;
        }

        .img-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.02);
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-header span {
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-top: 10px;
        }

        .about-content p {
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8; /* Melhor leitura */
        }

        .highlights {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .highlight-item h4 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .highlight-item span {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* --- SKILLS --- */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .skill-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .skill-pill i { color: var(--primary); }

            border-color: var(--primary);
            background: rgba(59, 130
